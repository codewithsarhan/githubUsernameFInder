<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevRadar | GitHub User Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <main class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold tracking-tight text-emerald-400">DevRadar</h1>
      <p class="text-slate-400 text-sm mt-1">Search any GitHub developer via XHR</p>
    </div>

    <!-- Search Form -->
    <form id="searchForm" class="flex gap-2 mb-6">
      <input
        type="text"
        id="usernameInput"
        placeholder="Enter GitHub username..."
        required
        class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
      />
      <button
        type="submit"
        id="searchBtn"
        class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-5 py-3 rounded-xl text-sm transition cursor-pointer"
      >
        Search
      </button>
    </form>

    <!-- Error Message Box (Default Hidden: remove 'hidden' class in JS when 404 happens) -->
    <div id="errorBox" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-xl p-4 text-center mb-6">
      User not found! Please check the username.
    </div>

    <!-- Profile Card (Default Hidden: remove 'hidden' class in JS when data loads) -->
    <section id="profileCard" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="flex items-center gap-4">
        <img
          id="avatar"
          src=""
          alt="User Avatar"
          class="w-20 h-20 rounded-full border-2 border-emerald-500 object-cover bg-slate-800"
        />
        <div>
          <h2 id="fullName" class="text-xl font-bold text-white">Developer Name</h2>
          <p id="userHandle" class="text-emerald-400 text-sm">@username</p>
        </div>
      </div>

      <p id="bio" class="text-slate-300 text-sm mt-4 leading-relaxed">
        Developer bio will appear here...
      </p>

      <!-- Stats Grid -->
      <div class="grid grid-cols-3 gap-3 bg-slate-950 border border-slate-800/80 rounded-xl p-4 mt-5 text-center">
        <div>
          <span class="block text-xs text-slate-400 uppercase tracking-wider">Repos</span>
          <span id="reposCount" class="text-lg font-bold text-white mt-1 block">0</span>
        </div>
        <div>
          <span class="block text-xs text-slate-400 uppercase tracking-wider">Followers</span>
          <span id="followersCount" class="text-lg font-bold text-white mt-1 block">0</span>
        </div>
        <div>
          <span class="block text-xs text-slate-400 uppercase tracking-wider">Following</span>
          <span id="followingCount" class="text-lg font-bold text-white mt-1 block">0</span>
        </div>
      </div>

      <!-- Profile Link -->
      <a
        id="profileLink"
        href="#"
        target = "_blank"
        class="mt-5 block w-full text-center bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium py-2.5 rounded-xl transition"
      >
        View GitHub Profile
      </a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
